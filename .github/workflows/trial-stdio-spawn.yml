name: trial-stdio-spawn

on:
  push:
    branches: ['claude/ci-trial-stdio-spawn']

permissions:
  contents: read

jobs:
  trial:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Claude Code
        shell: bash
        run: |
          npm install -g @anthropic-ai/claude-code || echo "npm install exit $?"
          claude --version || echo "claude --version exit $?"
      - name: Trial (PATH as is)
        shell: bash
        env:
          ANTHROPIC_API_KEY: ''
        run: python trial-stdio-spawn/run_trial.py main || true
      - name: Trial (Windows without Git sh)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ANTHROPIC_API_KEY: ''
        run: |
          python trial-stdio-spawn/run_trial.py nogitsh --strip-git-sh
          exit 0
