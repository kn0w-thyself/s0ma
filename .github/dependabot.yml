# What Dependabot watches in this repository, and how loudly.
#
# Two ecosystems, because two things here go stale on their own: the
# actions the workflows run, and the Python dependencies `uv.lock` pins.
# Both are GROUPED into one pull request per ecosystem per week. That is
# the difference between a signal somebody reads and a stream of
# notifications everybody learns to scroll past.
#
# What this file deliberately does NOT do:
#
#   * scan for credentials — that is a repository setting (secret
#     scanning and push protection, free on a public repository), not a
#     file. The milestone note
#     `plans/notes/front-door-a5-ci-additions.md` carries it as an owner
#     step;
#   * raise security advisories — once the repository is public those
#     arrive through the dependency graph whether this file exists or not.
#
# Nothing here changes what CI runs. A Dependabot pull request is an
# ordinary pull request: it passes the same gate as everybody else's, and
# it gets a human's yes before it merges.
version: 2

updates:
  # 1. The actions the workflows run. A small surface, and the one place
  #    where somebody else's release could change what this repository
  #    executes — worth seeing as a pull request rather than not at all.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/London
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: s0ma

  # 2. The Python workspace. The lockfile is the root `uv.lock` and the
  #    four packages are uv workspace members, so the workspace is one
  #    update unit and `directory: "/"` is where its manifest lives.
  #    Dependabot's `uv` ecosystem does read a workspace lockfile: its
  #    pull requests here regenerate the root `uv.lock`, and CI installs
  #    from the result.
  #
  #    `versioning-strategy: lockfile-only` keeps its pull requests to
  #    `uv.lock`. Left to choose, Dependabot also raises the version
  #    floors in the pyproject files to the newest release, and that is
  #    wrong here for two reasons:
  #
  #      * a floor is a statement about what the packages support. The
  #        extras ship in wheel metadata, so raising one forces every
  #        installer up with it. Floors move on evidence, by hand;
  #      * the four package pyproject files are sources the documentation
  #        build hashes. A pull request that edits one fails the gate
  #        until the documentation loop is rerun
  #        (`docs/operations/docs-maintenance.md`), which Dependabot
  #        cannot do. Such a pull request can never go green.
  #
  #    The cost: a release outside a declared range (a new major under a
  #    `<2` cap, say) is never proposed. Widening a range stays a person's
  #    job.
  #
  #    UNVERIFIED: GitHub's reference lists `uv` among the ecosystems that
  #    support `versioning-strategy` without saying which values each one
  #    honors. How to check: the first pull request this entry opens
  #    should change `uv.lock` and nothing else. If it still edits a
  #    pyproject file, Insights -> Dependency graph -> Dependabot shows
  #    the log of that run.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/London
    open-pull-requests-limit: 2
    versioning-strategy: lockfile-only
    groups:
      python-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: s0ma
