[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "s0ma-core"
version = "0.20.0"
description = "A Python framework for software self-knowledge — where the self-model is load-bearing."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "kn0wthyself", email = "support@kn0wthyself.ai" },
]
keywords = ["self-knowledge", "self-model", "architecture", "introspection"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]

[project.optional-dependencies]
api = ["fastapi>=0.100.0", "uvicorn[standard]>=0.54.0", "pydantic>=2.0"]
mcp = ["mcp>=1.0.0,<2"]
all = ["s0ma-core[api,mcp]"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    "mypy>=1.0",
    "ruff>=0.4",
    "httpx>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/s0ma"]
# The core teaching slice (plan F8, owner decision D-9). Before it, every
# pip-installed core answered "documentation files are not available in
# this installation" to every teaching question, because the user guide it
# read lived in the repository and no wheel has ever carried one. This one
# data file is the teaching content, generated by the documentation
# application and mirrored into the packaged tree, and s0ma.api.teaching
# reads it with importlib.resources.
#
# `packages` above already sweeps it in — it is a committed file inside the
# package directory. It is named here anyway because implicit inclusion is
# how it would go missing: an exclusion rule added later for some other
# reason would drop it silently, and the failure would look like the bug
# this milestone fixed. `artifacts` states the intent where a reader of
# this file can see it, and packages/s0ma-core/tests/test_teaching_slice.py
# proves a real wheel carries it.
artifacts = ["src/s0ma/_teaching/slice.json"]

# The example-execution plugin (plan M6) is opt-in: it exposes the
# --s0ma-examples flag but runs no examples unless the flag is set.
# Users who install s0ma-core into a project that uses pytest for
# other purposes see no behavior change.
[project.entry-points."pytest11"]
s0ma_examples = "s0ma.examples.plugin"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "SIM", "TCH"]

[tool.mypy]
strict = true
warn_return_any = true
disallow_untyped_defs = true
python_version = "3.11"

[[tool.mypy.overrides]]
module = "s0ma.api.rest"
disallow_untyped_decorators = false
# BaseModel resolves to Any when pydantic stubs are unavailable (it is
# an optional-extra). Subclassing Any is a first-class pattern for our
# REST response models, not a type-safety violation to chase.
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = "s0ma.api.mcp_server"
disallow_untyped_decorators = false
disallow_subclassing_any = false

# s0ma-dsl is a sibling package, not a declared runtime dependency of
# s0ma-core. It is imported lazily inside S0maDSLLoader only when a
# .s0ma file is encountered. The override declares the optional import
# intentional so mypy does not flag it as import-not-found.
[[tool.mypy.overrides]]
module = ["s0ma_dsl.*"]
ignore_missing_imports = true

# fastapi / pydantic / mcp are declared as optional extras in
# [project.optional-dependencies] (api / mcp). They are imported only
# by the api-layer modules and may be absent from the type-check env.
[[tool.mypy.overrides]]
module = ["fastapi.*", "pydantic.*", "mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
