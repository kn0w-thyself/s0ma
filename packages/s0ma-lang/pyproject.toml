[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "s0ma-lang"
version = "0.23.1"
description = "All of s0ma, the software self-knowledge platform, as one install: the runtime, the .s0ma language and its command line, the authoring server and the studi0 viewer, at one version."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "kn0wthyself", email = "support@kn0wthyself.ai" },
]
keywords = ["s0ma", "dsl", "mcp", "studi0", "self-model", "self-knowledge"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    # The umbrella carries no code. It is these four requirements and nothing
    # else, and each one names exactly this distribution's own version, so
    # `pip install s0ma-lang==X` can only resolve to the four parts released
    # together as X. A floor (`>=`) would let an installer pair this version
    # with a later part, which is the mixed set the umbrella exists to rule
    # out. The four pins move with the version line above at every release:
    # scripts/release_cut.sh rewrites both, and the docs-version-currency
    # stage (scripts/check_version_refs.py) fails when a pin and the lockstep
    # version disagree or when a workspace distribution is missing from this
    # list. The DSL pin asks for its `test` extra, which brings the pytest
    # that `s0ma test` runs.
    "s0ma-lang-core == 0.23.1",
    "s0ma-lang-dsl[test] == 0.23.1",
    "s0ma-lang-mcp == 0.23.1",
    "s0ma-lang-studi0 == 0.23.1",
]

[project.urls]
Homepage = "https://github.com/kn0w-thyself/s0ma"
Repository = "https://github.com/kn0w-thyself/s0ma"
Changelog = "https://github.com/kn0w-thyself/s0ma/blob/main/CHANGELOG.md"
Issues = "https://github.com/kn0w-thyself/s0ma/issues"

# No modules, no console script, no extras: everything a person runs or
# imports after installing this comes from the four distributions above.
# hatchling refuses to build a wheel it has selected no files for unless it is
# told that an empty selection is the intent, which is what this says. The
# wheel is its metadata and the license file.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.uv.sources]
s0ma-lang-core = { workspace = true }
s0ma-lang-dsl = { workspace = true }
s0ma-lang-mcp = { workspace = true }
s0ma-lang-studi0 = { workspace = true }
