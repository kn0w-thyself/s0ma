[project]
name = "circular_uses_graph"
version = "0.0.1"

[tool.s0ma]
source_roots = ["src"]
test_roots = []
build_dir = "circular_uses_graph_build"
bootstrap_files = []

# F3 stress fixture: A -> B -> C -> A in uses:. Pre-F3 the heuristic
# had no top-level module to nominate (every module is referenced by
# some other), so the budget silently no-opped. F3 marks `cycle_a` as
# the explicit page composer; the walker terminates correctly thanks
# to the seen set; the budget walks every reachable nerve exactly
# once (A, B, C). The s0ma-dsl resolver also detects the cycle and
# emits MODULE_DEPENDENCY_CYCLE — that is unrelated to F3 and is
# exercised by the cycle-detection tests; the F3 test exercises the
# budget walker directly via check_attribute_budgets() to verify
# termination on a cyclic graph.
[tool.s0ma.attribute_budgets]
landmark = "exactly_one_per_page"
